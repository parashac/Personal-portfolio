{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyProfile</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
  </head>
  <body>
<div class="container">
 <nav class="d-flex justify-content-between align-items-center py-3">
  <a href="{% url 'protfolio' %}" class="text-decoration-none text-dark fs-4 fw-bold">
    My Portfolio
  </a>

  <div>
    {% if user.is_authenticated %}
      <a href="{% url 'project-create' %}" class="btn btn-sm btn-outline-primary">Add Project</a>
      <form action="{% url 'logout' %}" method="post" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-sm btn-outline-success">Login</a>
    {% endif %}
  </div>
</nav>

    {% block content %}
    {% endblock content %}
</div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}">
    </script>
  </body>
</html>
